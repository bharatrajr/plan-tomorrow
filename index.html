<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plan Tomorrow Tonight</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#10142B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{
    --bg: #10142B;
    --surface: #1B2142;
    --surface-alt: #242B54;
    --line: #323a66;
    --text: #F2EFE9;
    --text-dim: #A9AEC9;
    --amber: #E8A33D;
    --amber-dim: #6b5228;
    --teal: #4FA3A0;
    --danger: #E0616B;
    --radius: 14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background: radial-gradient(120% 90% at 50% -10%, #1a2050 0%, var(--bg) 55%);
    color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom: 40px;
  }
  .wrap{ max-width:560px; margin:0 auto; padding: 18px 16px 8px; }

  /* header / signature element */
  header{ position:relative; padding: 22px 18px 20px; border-radius: 20px;
    background: linear-gradient(180deg, #171c3d 0%, #12162f 100%);
    overflow:hidden; border:1px solid var(--line); }
  .horizon{ position:absolute; left:0; right:0; bottom:30%; height:1px; background: linear-gradient(90deg, transparent, rgba(242,239,233,0.25), transparent); }
  .arc{ position:absolute; border-radius:50%; }
  .arc.moon{ width:64px; height:64px; background:var(--teal); left:8%; top:14px; box-shadow: inset -14px -6px 0 0 #12162f; }
  .arc.sun{ width:56px; height:56px; background:var(--amber); right:10%; top:22px; box-shadow: 0 0 24px 6px rgba(232,163,61,0.35); }
  .hdr-top{ display:flex; align-items:center; justify-content:space-between; position:relative; z-index:1; }
  .nav-btn{ background:none; border:1px solid var(--line); color:var(--text-dim); font-size:18px; width:34px; height:34px; border-radius:10px; cursor:pointer; }
  .nav-btn:active{ background:var(--surface-alt); }
  .eyebrow{ font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--text-dim); margin:0 0 4px; position:relative; z-index:1;}
  h1{ font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif; font-weight:600;
      font-size:28px; margin:0; position:relative; z-index:1; letter-spacing:.2px;}
  .sub{ font-size:13px; color:var(--text-dim); margin-top:6px; position:relative; z-index:1;}
  .hdr-actions{ display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; position:relative; z-index:1; }
  .bell-btn{ font-size:12.5px; color:var(--amber); background:rgba(232,163,61,0.1);
      border:1px solid var(--amber-dim); padding:7px 12px; border-radius:100px; cursor:pointer; }
  .bell-btn[data-on="1"]{ color:var(--teal); border-color:var(--teal); background:rgba(79,163,160,0.12);}
  .share-btn{ font-size:12.5px; color:var(--text-dim); background:rgba(242,239,233,0.06);
      border:1px solid var(--line); padding:7px 12px; border-radius:100px; cursor:pointer; }
  .share-btn:active{ background:var(--surface-alt); }

  /* add task row */
  .add-row{ display:flex; flex-wrap:wrap; gap:8px; margin: 18px 0 6px; }
  .add-row input[type=text]{ flex:1 1 140px; background:var(--surface); border:1px solid var(--line);
    color:var(--text); padding:12px 14px; border-radius:12px; font-size:15px; min-width:0; }
  .add-row input[type=text]::placeholder{ color: #6c7399; }
  .add-row select{ background:var(--surface); border:1px solid var(--line); color:var(--text-dim);
    border-radius:12px; padding:0 6px; font-size:13px; width:78px; flex:0 0 auto; }
  .add-row button{ background:var(--amber); border:none; color:#1a1508; font-weight:700;
    width:44px; border-radius:12px; font-size:20px; cursor:pointer; flex:0 0 auto; }
  .add-row button:active{ transform: scale(0.96); }

  .grid-controls{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin: 4px 2px 14px; }
  .hint{ font-size:12px; color:var(--text-dim); }
  .col-toggle{ flex:0 0 auto; background:none; border:1px solid var(--line); color:var(--text-dim);
    font-size:12px; padding:6px 10px; border-radius:100px; cursor:pointer; white-space:nowrap; }
  .col-toggle[data-on="1"]{ color:var(--teal); border-color:var(--teal); background:rgba(79,163,160,0.12); }

  /* unscheduled tray */
  .tray-label{ font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-dim); margin: 18px 2px 8px;}
  .tray{ display:flex; gap:8px; overflow-x:auto; padding: 2px 2px 10px; scrollbar-width:none; }
  .tray::-webkit-scrollbar{ display:none; }
  .tray:empty::after{ content:"Nothing waiting \2014 add a task above."; color:#565d84; font-size:13px; padding: 8px 4px;}
  .chip{ flex:0 0 auto; display:flex; align-items:center; gap:8px; background:var(--surface);
    border:1px solid var(--line); border-radius:100px; padding:9px 8px 9px 14px; font-size:14px; cursor:grab; user-select:none;}
  .chip.selected{ border-color:var(--amber); box-shadow: 0 0 0 2px rgba(232,163,61,0.25) inset; }
  .chip .x{ color:#7a8; opacity:.6; width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--text-dim); }
  .chip .x:active{ background:var(--surface-alt); }

  /* grid */
  .grid{ margin-top: 6px; border-radius: var(--radius); overflow:hidden; border:1px solid var(--line); }
  .slot{ display:flex; align-items:stretch; min-height:56px; border-bottom:1px solid var(--line); background: var(--surface); }
  .slot:last-child{ border-bottom:none; }
  .slot.now{ background: linear-gradient(90deg, rgba(232,163,61,0.08), transparent 40%); }
  .slot.dragover{ background: rgba(232,163,61,0.14); }
  .time{ flex:0 0 64px; display:flex; align-items:center; justify-content:center; font-size:12px;
    color:var(--text-dim); font-variant-numeric: tabular-nums; border-right:1px solid var(--line); }
  .slot-body{ flex:1; display:flex; flex-direction:column; align-items:stretch; justify-content:center; padding: 8px 10px; gap:6px; min-width:0; }
  .empty-slot{ color:#4b5280; font-size:13px; width:100%; padding:6px 2px; }
  .empty-slot.can-drop{ color:var(--amber); }
  .task{ display:flex; align-items:center; gap:6px; background:var(--surface-alt); border-radius:10px;
    padding:8px 10px; width:100%; min-width:0; }
  .task.done{ opacity:.45; }
  .task.continuation{ opacity:.55; background:transparent; border:1px dashed var(--line); }
  .task .title{ flex:1; font-size:14.5px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .task.done .title{ text-decoration: line-through; }
  .task button{ background:none; border:none; color:var(--text-dim); font-size:16px; cursor:pointer; padding:2px 4px; }
  .task .bell.on{ color:var(--teal); }
  .task .rm:active, .task .bell:active, .task .chk:active{ color:var(--text); }

  .dur-stepper{ display:flex; align-items:center; gap:3px; flex:0 0 auto; }
  .dur-stepper button{ width:20px; height:20px; border:1px solid var(--line); border-radius:6px;
    background:var(--surface); color:var(--text-dim); font-size:13px; line-height:1; padding:0; cursor:pointer; }
  .dur-stepper button:active{ background:var(--bg); color:var(--text); }
  .dur-label{ font-size:10.5px; color:var(--text-dim); min-width:18px; text-align:center; }

  /* optional two-column grid */
  .grid.two-col{ display:grid; grid-template-columns:1fr 1fr; grid-auto-flow:column; grid-template-rows: repeat(12, auto); }
  .grid.two-col .slot{ border-right:1px solid var(--line); }
  .grid.two-col .slot:nth-child(12), .grid.two-col .slot:nth-child(24){ border-bottom:none; }
  .grid.two-col .time{ flex-basis:48px; font-size:11px; }

  footer{ text-align:center; color:#565d84; font-size:11.5px; margin-top:22px; padding: 0 24px; line-height:1.5; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="horizon"></div>
    <div class="arc moon"></div>
    <div class="arc sun"></div>
    <div class="hdr-top">
      <button class="nav-btn" id="prevDay" aria-label="Previous day">&#8249;</button>
      <div style="text-align:center;">
        <p class="eyebrow" id="dayLabel">Planning for</p>
        <h1 id="dateHeading">&nbsp;</h1>
      </div>
      <button class="nav-btn" id="nextDay" aria-label="Next day">&#8250;</button>
    </div>
    <p class="sub" id="subLine"></p>
    <div class="hdr-actions">
      <button class="bell-btn" id="notifBtn">Enable reminders</button>
      <button class="share-btn" id="shareBtn">Share schedule</button>
    </div>
  </header>

  <div class="add-row">
    <input type="text" id="taskInput" placeholder="Add a task for tomorrow…" maxlength="80">
    <select id="timeSelect"><option value="">No time</option></select>
    <select id="durationSelect" aria-label="Duration"></select>
    <button id="addBtn" aria-label="Add task">+</button>
  </div>
  <div class="grid-controls">
    <p class="hint">Drag a task onto an hour, or tap it then tap the hour.</p>
    <button class="col-toggle" id="colToggle">&#8862; 2 columns</button>
  </div>

  <p class="tray-label">Unscheduled</p>
  <div class="tray" id="tray"></div>

  <div class="grid" id="grid"></div>

  <footer>Saved only on this device. Reminders fire while the app is open or running in the background on this browser — not guaranteed once fully closed, especially on iOS.</footer>
</div>

<script>
(function(){
  const STORE_KEY = 'ptt_data_v1';
  const FIRED_KEY = 'ptt_fired_v1';
  const HOURS = Array.from({length:24}, (_,i)=>i);

  let state = loadStore();
  let viewDate = tomorrowISO();
  let selectedChip = null; // task id currently tap-selected

  // ---------- storage ----------
  function loadStore(){
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
    catch(e){ return {}; }
  }
  function saveStore(){ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  function dayData(iso){
    if(!state[iso]) state[iso] = { tasks: [] };
    return state[iso];
  }
  function isoOf(d){
    const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  function todayISO(){ return isoOf(new Date()); }
  function tomorrowISO(){ const d=new Date(); d.setDate(d.getDate()+1); return isoOf(d); }
  function addDays(iso, n){ const [y,m,d]=iso.split('-').map(Number); const dt=new Date(y,m-1,d); dt.setDate(dt.getDate()+n); return isoOf(dt); }
  function fmtHour(h){ const period = h<12 ? 'AM':'PM'; let hh = h%12; if(hh===0) hh=12; return `${hh}${period==='AM'&&h===0?'':''} ${period}`; }
  function fmtHourShort(h){ let hh=h%12; if(hh===0)hh=12; return hh + (h<12?'a':'p'); }
  function uid(){ return 't'+Math.random().toString(36).slice(2,9); }
  function niceDate(iso){
    const [y,m,d] = iso.split('-').map(Number);
    const dt = new Date(y,m-1,d);
    return dt.toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' });
  }

  // ---------- time select options ----------
  const timeSelect = document.getElementById('timeSelect');
  HOURS.forEach(h=>{
    const opt = document.createElement('option');
    opt.value = h;
    opt.textContent = fmtHour(h);
    timeSelect.appendChild(opt);
  });

  const durationSelect = document.getElementById('durationSelect');
  [1,2,3,4,5,6].forEach(n=>{
    const opt = document.createElement('option');
    opt.value = n;
    opt.textContent = n + 'h';
    durationSelect.appendChild(opt);
  });

  // ---------- two-column layout toggle ----------
  // Defaults to two columns on mobile landscape until the user picks explicitly, then that choice sticks.
  const TWOCOL_KEY = 'ptt_twocol_v1';
  const landscapeMQ = window.matchMedia('(max-width: 900px) and (orientation: landscape)');
  let twoColOverride = localStorage.getItem(TWOCOL_KEY); // '0' | '1' | null (no explicit choice yet)
  let twoCol = twoColOverride !== null ? twoColOverride === '1' : landscapeMQ.matches;
  const colToggle = document.getElementById('colToggle');
  function refreshColToggle(){
    colToggle.dataset.on = twoCol ? '1' : '0';
    colToggle.innerHTML = twoCol ? '&#8863; 1 column' : '&#8862; 2 columns';
  }
  colToggle.addEventListener('click', ()=>{
    twoCol = !twoCol;
    twoColOverride = twoCol ? '1' : '0';
    localStorage.setItem(TWOCOL_KEY, twoColOverride);
    refreshColToggle();
    renderGrid(dayData(viewDate));
  });
  refreshColToggle();
  const handleOrientationChange = ()=>{
    if(twoColOverride !== null) return; // user already picked explicitly
    twoCol = landscapeMQ.matches;
    refreshColToggle();
    renderGrid(dayData(viewDate));
  };
  if(landscapeMQ.addEventListener) landscapeMQ.addEventListener('change', handleOrientationChange);
  else landscapeMQ.addListener(handleOrientationChange);
  window.addEventListener('resize', handleOrientationChange);

  // ---------- rendering ----------
  function render(){
    const data = dayData(viewDate);
    const isToday = viewDate === todayISO();
    const isTomorrow = viewDate === tomorrowISO();
    document.getElementById('dayLabel').textContent = isTomorrow ? 'Planning tonight for' : (isToday ? 'Today' : 'Planning for');
    document.getElementById('dateHeading').textContent = niceDate(viewDate);
    document.getElementById('subLine').textContent = isTomorrow
      ? 'Set it now, wake up already on track.'
      : (isToday ? 'This is the plan already in motion.' : 'Not tomorrow — just browsing.');

    renderTray(data);
    renderGrid(data);
  }

  function renderTray(data){
    const tray = document.getElementById('tray');
    tray.innerHTML = '';
    data.tasks.filter(t => t.time === null).forEach(t => {
      tray.appendChild(makeChip(t));
    });
  }

  function makeChip(t){
    const chip = document.createElement('div');
    chip.className = 'chip' + (selectedChip === t.id ? ' selected' : '');
    chip.draggable = true;
    chip.dataset.id = t.id;

    const label = document.createElement('span');
    label.textContent = t.title;
    chip.appendChild(label);

    const x = document.createElement('span');
    x.className = 'x';
    x.textContent = '\u00d7';
    x.addEventListener('click', (e)=>{ e.stopPropagation(); removeTask(t.id); });
    chip.appendChild(x);

    chip.addEventListener('click', ()=>{
      selectedChip = (selectedChip === t.id) ? null : t.id;
      render();
    });
    chip.addEventListener('dragstart', (e)=>{
      e.dataTransfer.setData('text/plain', t.id);
      e.dataTransfer.effectAllowed = 'move';
    });
    return chip;
  }

  function renderGrid(data){
    const grid = document.getElementById('grid');
    grid.className = 'grid' + (twoCol ? ' two-col' : '');
    grid.innerHTML = '';
    const nowHour = new Date().getHours();
    const isToday = viewDate === todayISO();

    HOURS.forEach(h=>{
      const row = document.createElement('div');
      row.className = 'slot' + (isToday && h === nowHour ? ' now' : '');
      row.dataset.hour = h;

      const time = document.createElement('div');
      time.className = 'time';
      time.textContent = fmtHourShort(h);
      row.appendChild(time);

      const body = document.createElement('div');
      body.className = 'slot-body';

      const occupants = data.tasks.filter(t => t.time !== null && h >= t.time && h < t.time + (t.duration || 1));
      if(occupants.length === 0){
        const empty = document.createElement('div');
        empty.className = 'empty-slot';
        empty.textContent = selectedChip ? 'Tap here to place' : '\u2014';
        body.appendChild(empty);
      } else {
        occupants.forEach(t => body.appendChild(makeTaskRow(t, { continuation: t.time !== h })));
      }

      row.appendChild(body);

      // drag targets
      row.addEventListener('dragover', (e)=>{ e.preventDefault(); row.classList.add('dragover'); });
      row.addEventListener('dragleave', ()=> row.classList.remove('dragover'));
      row.addEventListener('drop', (e)=>{
        e.preventDefault();
        row.classList.remove('dragover');
        const id = e.dataTransfer.getData('text/plain');
        if(id) assignTime(id, h);
      });
      // tap-to-place
      row.addEventListener('click', (e)=>{
        if(e.target.closest('.task')) return;
        if(selectedChip){ assignTime(selectedChip, h); selectedChip = null; }
      });

      grid.appendChild(row);
    });
  }

  function makeTaskRow(t, opts){
    opts = opts || {};
    const row = document.createElement('div');
    row.className = 'task' + (t.done ? ' done' : '') + (opts.continuation ? ' continuation' : '');

    const chk = document.createElement('button');
    chk.className = 'chk';
    chk.textContent = t.done ? '\u2611' : '\u2610';
    chk.title = 'Mark done';
    chk.addEventListener('click', ()=>{ t.done = !t.done; saveStore(); render(); });
    row.appendChild(chk);

    const title = document.createElement('span');
    title.className = 'title';
    title.textContent = (opts.continuation ? '\u21b3 ' : '') + t.title;
    row.appendChild(title);

    if(t.time !== null && !opts.continuation){
      row.appendChild(makeDurStepper(t));
    }

    const bell = document.createElement('button');
    bell.className = 'bell' + (t.reminder ? ' on' : '');
    bell.textContent = t.reminder ? '\ud83d\udd14' : '\ud83d\udd15';
    bell.title = 'Toggle reminder';
    bell.addEventListener('click', ()=>{ t.reminder = !t.reminder; saveStore(); render(); });
    row.appendChild(bell);

    const rm = document.createElement('button');
    rm.className = 'rm';
    rm.textContent = '\u00d7';
    rm.title = 'Remove';
    rm.addEventListener('click', ()=> removeTask(t.id));
    row.appendChild(rm);

    return row;
  }

  function makeDurStepper(t){
    const wrap = document.createElement('div');
    wrap.className = 'dur-stepper';

    const minus = document.createElement('button');
    minus.textContent = '−';
    minus.title = 'Shorten block';
    minus.addEventListener('click', (e)=>{ e.stopPropagation(); changeDuration(t.id, -1); });
    wrap.appendChild(minus);

    const label = document.createElement('span');
    label.className = 'dur-label';
    label.textContent = (t.duration || 1) + 'h';
    wrap.appendChild(label);

    const plus = document.createElement('button');
    plus.textContent = '+';
    plus.title = 'Block another hour';
    plus.addEventListener('click', (e)=>{ e.stopPropagation(); changeDuration(t.id, 1); });
    wrap.appendChild(plus);

    return wrap;
  }

  // ---------- mutations ----------
  function addTask(title, time, duration){
    const data = dayData(viewDate);
    data.tasks.push({ id: uid(), title, time: time===''||time===undefined ? null : Number(time), duration: duration ? Number(duration) : 1, reminder: false, done: false });
    saveStore();
    render();
  }
  function removeTask(id){
    const data = dayData(viewDate);
    data.tasks = data.tasks.filter(t => t.id !== id);
    if(selectedChip === id) selectedChip = null;
    saveStore();
    render();
  }
  function assignTime(id, hour){
    const data = dayData(viewDate);
    const t = data.tasks.find(t=>t.id===id);
    if(t){ t.time = hour; saveStore(); render(); }
  }
  function changeDuration(id, delta){
    const data = dayData(viewDate);
    const t = data.tasks.find(t=>t.id===id);
    if(!t || t.time === null) return;
    const maxDur = 24 - t.time;
    const next = Math.min(maxDur, Math.max(1, (t.duration || 1) + delta));
    t.duration = next;
    saveStore();
    render();
  }

  // ---------- add row wiring ----------
  document.getElementById('addBtn').addEventListener('click', submitAdd);
  document.getElementById('taskInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter') submitAdd(); });
  function submitAdd(){
    const input = document.getElementById('taskInput');
    const title = input.value.trim();
    if(!title) return;
    addTask(title, timeSelect.value, durationSelect.value);
    input.value = '';
    timeSelect.value = '';
    durationSelect.value = '1';
    input.focus();
  }

  // ---------- day nav ----------
  document.getElementById('prevDay').addEventListener('click', ()=>{ viewDate = addDays(viewDate, -1); selectedChip=null; render(); });
  document.getElementById('nextDay').addEventListener('click', ()=>{ viewDate = addDays(viewDate, 1); selectedChip=null; render(); });

  // ---------- reminders ----------
  const notifBtn = document.getElementById('notifBtn');
  function refreshNotifBtn(){
    const on = ('Notification' in window) && Notification.permission === 'granted';
    notifBtn.dataset.on = on ? '1' : '0';
    notifBtn.textContent = on ? 'Reminders on' : 'Enable reminders';
  }
  notifBtn.addEventListener('click', async ()=>{
    if(!('Notification' in window)) { alert('Notifications are not supported in this browser.'); return; }
    if(Notification.permission === 'default'){ await Notification.requestPermission(); }
    refreshNotifBtn();
  });
  refreshNotifBtn();

  function firedSet(){ try { return new Set(JSON.parse(localStorage.getItem(FIRED_KEY)) || []); } catch(e){ return new Set(); } }
  function saveFired(set){ localStorage.setItem(FIRED_KEY, JSON.stringify(Array.from(set))); }

  function checkReminders(){
    if(!('Notification' in window) || Notification.permission !== 'granted') return;
    const now = new Date();
    const iso = isoOf(now);
    const hour = now.getHours();
    const data = state[iso];
    if(!data) return;
    const fired = firedSet();
    data.tasks.forEach(t=>{
      if(t.reminder && !t.done && t.time === hour){
        const key = iso + '_' + t.id + '_' + hour;
        if(!fired.has(key)){
          fired.add(key);
          notify(t.title, iso);
        }
      }
    });
    saveFired(fired);
  }

  function notify(title, iso){
    const body = 'Scheduled for now \u2014 ' + niceDate(iso);
    if(navigator.serviceWorker && navigator.serviceWorker.ready){
      navigator.serviceWorker.ready.then(reg=>{
        reg.showNotification(title, { body, icon: 'icon-192.png', badge: 'icon-192.png' });
      }).catch(()=>{ new Notification(title, { body }); });
    } else {
      new Notification(title, { body });
    }
  }

  setInterval(checkReminders, 20000);
  checkReminders();

  // ---------- share as image ----------
  function buildScheduleCanvas(){
    const data = dayData(viewDate);
    const scheduled = data.tasks.filter(t => t.time !== null).sort((a,b)=> a.time - b.time);
    const unscheduled = data.tasks.filter(t => t.time === null);
    const lineH = 32;
    const padding = 26;
    const headerH = 68;
    const width = 680;
    const rowCount = scheduled.length + unscheduled.length || 1;
    const height = headerH + rowCount * lineH + (unscheduled.length ? lineH + 10 : 0) + padding * 2;

    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext('2d');

    ctx.fillStyle = '#10142B';
    ctx.fillRect(0, 0, width, height);

    ctx.fillStyle = '#F2EFE9';
    ctx.font = '600 26px Georgia, "Iowan Old Style", serif';
    ctx.fillText(niceDate(viewDate), padding, padding + 24);

    ctx.strokeStyle = '#323a66';
    ctx.beginPath(); ctx.moveTo(padding, headerH); ctx.lineTo(width - padding, headerH); ctx.stroke();

    let y = headerH + 32;
    if(scheduled.length === 0){
      ctx.fillStyle = '#A9AEC9';
      ctx.font = '15px -apple-system, "Segoe UI", Roboto, sans-serif';
      ctx.fillText('Nothing scheduled yet.', padding, y);
      y += lineH;
    } else {
      scheduled.forEach(t=>{
        const dur = t.duration || 1;
        const timeLabel = dur > 1 ? `${fmtHour(t.time)}–${fmtHour(t.time + dur)}` : fmtHour(t.time);
        ctx.fillStyle = '#E8A33D';
        ctx.font = '600 14.5px -apple-system, "Segoe UI", Roboto, sans-serif';
        ctx.fillText(timeLabel, padding, y);
        ctx.fillStyle = t.done ? '#6c7399' : '#F2EFE9';
        ctx.font = '14.5px -apple-system, "Segoe UI", Roboto, sans-serif';
        ctx.fillText((t.done ? '✓ ' : '') + t.title, padding + 150, y);
        y += lineH;
      });
    }

    if(unscheduled.length){
      y += 10;
      ctx.fillStyle = '#A9AEC9';
      ctx.font = '600 12px -apple-system, "Segoe UI", Roboto, sans-serif';
      ctx.fillText('UNSCHEDULED', padding, y);
      y += lineH;
      unscheduled.forEach(t=>{
        ctx.fillStyle = t.done ? '#6c7399' : '#F2EFE9';
        ctx.font = '14.5px -apple-system, "Segoe UI", Roboto, sans-serif';
        ctx.fillText((t.done ? '✓ ' : '• ') + t.title, padding, y);
        y += lineH;
      });
    }

    return canvas;
  }

  function shareSchedule(){
    const canvas = buildScheduleCanvas();
    canvas.toBlob(async (blob)=>{
      if(!blob) return;
      const fileName = 'schedule-' + viewDate + '.png';
      const file = new File([blob], fileName, { type: 'image/png' });

      if(navigator.canShare && navigator.canShare({ files: [file] })){
        try {
          await navigator.share({ files: [file], title: 'My schedule', text: niceDate(viewDate) });
        } catch(e){ /* user cancelled the share sheet */ }
      } else {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(()=> URL.revokeObjectURL(url), 4000);
      }
    }, 'image/png');
  }

  document.getElementById('shareBtn').addEventListener('click', shareSchedule);

  // ---------- service worker ----------
  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    });
  }

  render();
})();
</script>
</body>
</html>
