<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Plan</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#F6F4EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plan">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root{
    color-scheme: light;
    --bg: #F6F4EF;
    --surface: #FFFFFF;
    --surface-alt: #EFECE4;
    --line: #E6E2D8;
    --line-strong: #D6D1C4;
    --text: #1E2330;
    --text-dim: #667085;
    --text-faint: #A3A9B8;
    --accent: #3B5BDB;
    --accent-ink: #2B44A8;
    --accent-soft: #E8EDFD;
    --accent-edge: #B9C6F4;
    --now: #E67700;
    --now-soft: #FFF4E0;
    --done: #2F9E44;
    --radius: 16px;
    --shadow: 0 1px 2px rgba(30,35,48,.05), 0 4px 14px rgba(30,35,48,.05);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html{ color-scheme: light; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: calc(40px + env(safe-area-inset-bottom));
  }
  button{ font:inherit; color:inherit; }
  [hidden]{ display:none !important; }
  .wrap{ max-width:600px; margin:0 auto; padding: calc(14px + env(safe-area-inset-top)) 16px 8px; }
  @media (orientation: landscape) and (max-width: 900px){ .wrap{ max-width:none; } }

  svg{ display:block; flex:none; }
  [data-icon] svg{ width:18px; height:18px; }

  /* top bar */
  .topbar{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .logo{ width:34px; height:34px; border-radius:11px; background:var(--accent); color:#fff; display:grid; place-items:center; box-shadow:0 2px 6px rgba(59,91,219,.35); }
  .logo svg{ width:20px; height:20px; }
  .brand h1{ margin:0; font-size:23px; font-weight:800; letter-spacing:-.02em; }
  .actions{ display:flex; gap:8px; }
  .pill{ display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line-strong); background:var(--surface);
    color:var(--text-dim); font-size:13px; font-weight:600; padding:0 12px; min-height:36px; border-radius:999px; cursor:pointer; white-space:nowrap; }
  .pill:active{ background:var(--surface-alt); }
  .pill[data-on="1"]{ color:var(--accent-ink); border-color:var(--accent); background:var(--accent-soft); }
  .pill.sm{ min-height:30px; padding:0 10px; font-size:12px; }
  .pill.sm svg{ width:14px; height:14px; }
  .pill svg{ width:16px; height:16px; }

  /* day switcher */
  .seg{ display:grid; grid-template-columns:1fr 1fr; background:var(--surface-alt); border-radius:12px; padding:3px; gap:3px; }
  .seg button{ border:none; background:none; padding:9px 0; border-radius:9px; font-weight:600; font-size:14px; color:var(--text-dim); cursor:pointer; }
  .seg button[aria-selected="true"]{ background:var(--surface); color:var(--text); box-shadow:0 1px 2px rgba(30,35,48,.14); }

  .daycard{ display:flex; align-items:center; gap:8px; margin-top:12px; background:var(--surface);
    border:1px solid var(--line); border-radius:var(--radius); padding:14px 10px; box-shadow:var(--shadow); }
  .daycard .mid{ flex:1; text-align:center; min-width:0; }
  .eyebrow{ margin:0; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); font-weight:700; }
  .daycard h2{ margin:2px 0 0; font-size:22px; font-weight:750; letter-spacing:-.01em; }
  .sub{ margin:4px 0 0; font-size:13px; color:var(--text-dim); }
  .progress{ height:4px; background:var(--surface-alt); border-radius:99px; overflow:hidden; margin:10px auto 0; max-width:220px; }
  .progress span{ display:block; height:100%; width:0; background:var(--done); border-radius:99px; transition:width .3s; }
  .nav-btn{ flex:none; width:40px; height:40px; border-radius:12px; border:1px solid var(--line); background:var(--surface);
    color:var(--text-dim); display:grid; place-items:center; cursor:pointer; padding:0; }
  .nav-btn:active{ background:var(--surface-alt); }
  .nav-btn svg{ width:20px; height:20px; }

  /* add task */
  .add{ margin-top:14px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px; box-shadow:var(--shadow); display:grid; gap:8px; }
  .add input[type=text], .add select{ border:1px solid var(--line-strong); background:var(--bg); color:var(--text);
    border-radius:12px; font-size:16px; outline:none; min-width:0; }
  .add input[type=text]{ width:100%; padding:12px 14px; }
  .add input::placeholder{ color:var(--text-faint); }
  .add input:focus, .add select:focus{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .add .row{ display:flex; gap:8px; }
  .add select{ flex:1 1 0; padding:10px 6px; height:44px; }
  .add .go{ flex:1.1 1 0; display:inline-flex; align-items:center; justify-content:center; gap:6px; height:44px;
    background:var(--accent); color:#fff; border:none; border-radius:12px; font-weight:700; cursor:pointer; padding:0 14px; }
  .add .go:active{ background:var(--accent-ink); }
  .add .go svg{ width:18px; height:18px; }

  .hint{ margin:10px 2px 0; font-size:12.5px; color:var(--text-dim); }

  /* unscheduled tray */
  .sec-label{ margin:0; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-dim); font-weight:700; }
  .tray-label{ margin:16px 2px 8px; }
  .tray{ display:flex; gap:8px; overflow-x:auto; padding:2px 2px 8px; scrollbar-width:none; }
  .tray::-webkit-scrollbar{ display:none; }
  .tray:empty::after{ content:"Nothing waiting \2014 add a task above."; color:var(--text-faint); font-size:13px; padding:6px 2px; }
  .chip{ flex:none; display:flex; align-items:center; gap:4px; background:var(--surface); border:1px solid var(--line-strong);
    border-radius:999px; padding:6px 6px 6px 14px; font-size:14px; font-weight:500; cursor:grab; user-select:none; box-shadow:0 1px 1px rgba(30,35,48,.04); }
  .chip.selected{ border-color:var(--accent); background:var(--accent-soft); color:var(--accent-ink); }
  .chip .x{ width:24px; height:24px; border-radius:50%; display:grid; place-items:center; color:var(--text-faint); }
  .chip .x svg{ width:14px; height:14px; }
  .chip .x:active{ background:rgba(30,35,48,.08); }

  /* schedule */
  .tools{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin:14px 2px 8px; }
  .tool-btns{ display:flex; gap:6px; }
  .grid{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); }
  .slot{ display:flex; align-items:stretch; min-height:54px; border-bottom:1px solid var(--line); background:var(--surface); }
  .slot:last-child{ border-bottom:none; }
  .slot.now{ background:var(--now-soft); box-shadow: inset 3px 0 0 var(--now); }
  .slot.dragover{ background:var(--accent-soft); }
  .time{ flex:0 0 58px; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600;
    color:var(--text-faint); font-variant-numeric:tabular-nums; border-right:1px solid var(--line); }
  .slot.now .time{ color:var(--now); }
  .slot.past .time{ opacity:.6; }
  .slot-body{ flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; gap:6px; padding:7px 10px; }
  .empty-slot{ color:var(--text-faint); font-size:13px; padding:6px 2px; min-height:20px; }
  .empty-slot.place{ color:var(--accent); font-weight:600; }

  .task{ display:flex; flex-wrap:wrap; align-items:center; gap:2px 8px; background:var(--accent-soft);
    border-left:3px solid var(--accent); border-radius:10px; padding:6px 6px 6px 9px; min-width:0; }
  .task.done{ background:var(--surface-alt); border-left-color:var(--line-strong); }
  .task.done .title{ text-decoration:line-through; color:var(--text-dim); }
  .task.continuation{ background:transparent; border:1px dashed var(--accent-edge); border-left:3px solid var(--accent-edge); }
  .task .title{ flex:1 1 100px; min-width:0; font-size:14.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .task .acts{ display:flex; align-items:center; gap:2px; margin-left:auto; }
  .chk{ position:relative; flex:none; width:22px; height:22px; border-radius:50%; border:2px solid var(--accent); background:var(--surface);
    display:grid; place-items:center; color:#fff; cursor:pointer; padding:0; }
  .chk::after{ content:""; position:absolute; inset:-8px; }
  .chk svg{ width:13px; height:13px; opacity:0; }
  .task.done .chk{ background:var(--done); border-color:var(--done); }
  .task.done .chk svg{ opacity:1; }
  .icon-btn{ width:30px; height:30px; border:none; background:none; border-radius:8px; display:grid; place-items:center;
    color:var(--text-faint); cursor:pointer; padding:0; }
  .icon-btn svg{ width:16px; height:16px; }
  .icon-btn:active{ background:rgba(30,35,48,.08); }
  .icon-btn.on{ color:var(--accent-ink); }

  .dur{ display:flex; align-items:center; background:var(--surface); border:1px solid var(--line-strong); border-radius:8px; overflow:hidden; }
  .dur button{ width:24px; height:26px; border:none; background:none; color:var(--text-dim); cursor:pointer; padding:0; display:grid; place-items:center; }
  .dur button:active{ background:var(--surface-alt); }
  .dur button:disabled{ opacity:.3; cursor:default; }
  .dur button svg{ width:12px; height:12px; }
  .dur span{ font-size:12px; font-weight:700; min-width:24px; text-align:center; }

  /* optional two-column grid */
  .grid.two-col{ display:grid; grid-template-columns:1fr 1fr; grid-auto-flow:column; grid-template-rows:repeat(12, auto); }
  .grid.two-col .slot:nth-child(-n+12){ border-right:1px solid var(--line); }
  .grid.two-col .slot:nth-child(12), .grid.two-col .slot:nth-child(24){ border-bottom:none; }
  .grid.two-col .time{ flex-basis:50px; font-size:11px; }
  .grid.two-col .slot-body{ padding:6px 7px; }

  footer{ text-align:center; color:var(--text-faint); font-size:11.5px; margin-top:22px; padding:0 24px; line-height:1.5; }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">
      <div class="logo" data-icon="logo"></div>
      <h1>Plan</h1>
    </div>
    <div class="actions">
      <button class="pill" id="notifBtn"><span data-icon="bell"></span><span id="notifLabel">Reminders</span></button>
      <button class="pill" id="shareBtn"><span data-icon="share"></span>Share</button>
    </div>
  </div>

  <div class="seg" role="tablist" aria-label="Day">
    <button role="tab" id="segToday">Today</button>
    <button role="tab" id="segTomorrow">Tomorrow</button>
  </div>

  <section class="daycard">
    <button class="nav-btn" id="prevDay" aria-label="Previous day" data-icon="left"></button>
    <div class="mid">
      <p class="eyebrow" id="dayLabel">&nbsp;</p>
      <h2 id="dateHeading">&nbsp;</h2>
      <p class="sub" id="subLine"></p>
      <div class="progress"><span id="progressBar"></span></div>
    </div>
    <button class="nav-btn" id="nextDay" aria-label="Next day" data-icon="right"></button>
  </section>

  <form class="add" id="addForm" autocomplete="off">
    <input type="text" id="taskInput" placeholder="Add a task…" maxlength="80" enterkeyhint="done">
    <div class="row">
      <select id="timeSelect" aria-label="Start time"><option value="">No time</option></select>
      <select id="durationSelect" aria-label="Duration"></select>
      <button class="go" id="addBtn" type="submit"><span data-icon="plus"></span>Add</button>
    </div>
  </form>
  <p class="hint">Drag a task onto an hour, or tap it then tap the hour.</p>

  <p class="sec-label tray-label">Unscheduled</p>
  <div class="tray" id="tray"></div>

  <div class="tools">
    <p class="sec-label">Schedule</p>
    <div class="tool-btns">
      <button class="pill sm" id="nowBtn" hidden><span data-icon="clock"></span>Now</button>
      <button class="pill sm" id="colToggle"></button>
    </div>
  </div>
  <div class="grid" id="grid"></div>

  <footer>Saved only on this device. Reminders fire while the app is open or running in the background on this browser — not guaranteed once fully closed, especially on iOS.</footer>
</div>

<script>
(function(){
  const STORE_KEY = 'ptt_data_v1';
  const FIRED_KEY = 'ptt_fired_v1';
  const TWOCOL_KEY = 'ptt_twocol_v1';
  const HOURS = Array.from({length:24}, (_,i)=>i);

  // ---------- icons ----------
  const ICONS = {
    logo: '<polyline points="20 6 9 17 4 12" stroke-width="3"/>',
    check: '<polyline points="20 6 9 17 4 12" stroke-width="3"/>',
    bell: '<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',
    bellOff: '<path d="M13.7 21a2 2 0 0 1-3.4 0"/><path d="M18.6 13A17 17 0 0 1 18 8a6 6 0 0 0-9.3-5"/><path d="M6.3 6.3A6 6 0 0 0 6 8c0 7-3 9-3 9h14"/><line x1="1" y1="1" x2="23" y2="23"/>',
    share: '<path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/>',
    left: '<polyline points="15 18 9 12 15 6"/>',
    right: '<polyline points="9 18 15 12 9 6"/>',
    plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
    minus: '<line x1="5" y1="12" x2="19" y2="12"/>',
    x: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
    clock: '<circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/>',
    columns: '<rect x="3" y="3" width="18" height="18" rx="2"/><line x1="12" y1="3" x2="12" y2="21"/>',
    rows: '<rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/>'
  };
  function svg(name){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[name] + '</svg>';
  }
  function el(tag, cls){ const e = document.createElement(tag); if(cls) e.className = cls; return e; }
  document.querySelectorAll('[data-icon]').forEach(n => { n.innerHTML = svg(n.dataset.icon); });

  // ---------- state ----------
  let state = loadStore();
  let viewDate = new Date().getHours() >= 18 ? tomorrowISO() : todayISO();
  let selectedChip = null; // task id currently tap-selected

  function loadStore(){
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
    catch(e){ return {}; }
  }
  function saveStore(){ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  function dayData(iso){
    if(!state[iso]) state[iso] = { tasks: [] };
    return state[iso];
  }
  function isoOf(d){
    const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  function todayISO(){ return isoOf(new Date()); }
  function tomorrowISO(){ const d=new Date(); d.setDate(d.getDate()+1); return isoOf(d); }
  function addDays(iso, n){ const [y,m,d]=iso.split('-').map(Number); const dt=new Date(y,m-1,d); dt.setDate(dt.getDate()+n); return isoOf(dt); }
  function fmtHour(h){ h = h % 24; const hh = h%12 === 0 ? 12 : h%12; return `${hh} ${h<12 ? 'AM':'PM'}`; }
  function uid(){ return 't'+Math.random().toString(36).slice(2,9); }
  function niceDate(iso){
    const [y,m,d] = iso.split('-').map(Number);
    return new Date(y,m-1,d).toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' });
  }

  // ---------- form options ----------
  const timeSelect = document.getElementById('timeSelect');
  HOURS.forEach(h=>{
    const opt = document.createElement('option');
    opt.value = h;
    opt.textContent = fmtHour(h);
    timeSelect.appendChild(opt);
  });
  const durationSelect = document.getElementById('durationSelect');
  [1,2,3,4,5,6].forEach(n=>{
    const opt = document.createElement('option');
    opt.value = n;
    opt.textContent = n + (n === 1 ? ' hour' : ' hours');
    durationSelect.appendChild(opt);
  });

  // ---------- two-column layout toggle ----------
  // Defaults to two columns on mobile landscape until the user picks explicitly, then that choice sticks.
  const landscapeMQ = window.matchMedia('(max-width: 900px) and (orientation: landscape)');
  let twoColOverride = localStorage.getItem(TWOCOL_KEY); // '0' | '1' | null (no explicit choice yet)
  let twoCol = twoColOverride !== null ? twoColOverride === '1' : landscapeMQ.matches;
  const colToggle = document.getElementById('colToggle');
  function refreshColToggle(){
    colToggle.dataset.on = twoCol ? '1' : '0';
    colToggle.innerHTML = svg(twoCol ? 'rows' : 'columns') + '<span>' + (twoCol ? '1 column' : '2 columns') + '</span>';
  }
  colToggle.addEventListener('click', ()=>{
    twoCol = !twoCol;
    twoColOverride = twoCol ? '1' : '0';
    localStorage.setItem(TWOCOL_KEY, twoColOverride);
    refreshColToggle();
    renderGrid(dayData(viewDate));
  });
  refreshColToggle();
  const handleOrientationChange = ()=>{
    if(twoColOverride !== null) return; // user already picked explicitly
    if(twoCol === landscapeMQ.matches) return;
    twoCol = landscapeMQ.matches;
    refreshColToggle();
    renderGrid(dayData(viewDate));
  };
  if(landscapeMQ.addEventListener) landscapeMQ.addEventListener('change', handleOrientationChange);
  else landscapeMQ.addListener(handleOrientationChange);
  window.addEventListener('resize', handleOrientationChange);

  // ---------- rendering ----------
  const segToday = document.getElementById('segToday');
  const segTomorrow = document.getElementById('segTomorrow');
  const nowBtn = document.getElementById('nowBtn');
  const taskInput = document.getElementById('taskInput');

  function render(){
    const data = dayData(viewDate);
    const today = todayISO(), tomorrow = tomorrowISO();
    segToday.setAttribute('aria-selected', String(viewDate === today));
    segTomorrow.setAttribute('aria-selected', String(viewDate === tomorrow));
    nowBtn.hidden = viewDate !== today;

    document.getElementById('dayLabel').textContent =
      viewDate === today ? 'Today' : viewDate === tomorrow ? 'Tomorrow' : (viewDate < today ? 'Earlier' : 'Coming up');
    document.getElementById('dateHeading').textContent = niceDate(viewDate);
    taskInput.placeholder =
      viewDate === today ? 'Add a task for today…' : viewDate === tomorrow ? 'Add a task for tomorrow…' : 'Add a task…';

    const total = data.tasks.length;
    const done = data.tasks.filter(t => t.done).length;
    document.getElementById('subLine').textContent =
      total === 0 ? 'Nothing planned yet — add your first task.'
      : done === total ? 'All done. Nice work.'
      : `${done} of ${total} done`;
    document.getElementById('progressBar').style.width = (total ? Math.round(done / total * 100) : 0) + '%';

    renderTray(data);
    renderGrid(data);
  }

  function renderTray(data){
    const tray = document.getElementById('tray');
    tray.innerHTML = '';
    data.tasks.filter(t => t.time === null).forEach(t => tray.appendChild(makeChip(t)));
  }

  function makeChip(t){
    const chip = el('div', 'chip' + (selectedChip === t.id ? ' selected' : ''));
    chip.draggable = true;
    chip.dataset.id = t.id;

    const label = el('span');
    label.textContent = t.title;
    chip.appendChild(label);

    const x = el('span', 'x');
    x.innerHTML = svg('x');
    x.addEventListener('click', (e)=>{ e.stopPropagation(); removeTask(t.id); });
    chip.appendChild(x);

    chip.addEventListener('click', ()=>{
      selectedChip = (selectedChip === t.id) ? null : t.id;
      render();
    });
    chip.addEventListener('dragstart', (e)=>{
      e.dataTransfer.setData('text/plain', t.id);
      e.dataTransfer.effectAllowed = 'move';
    });
    return chip;
  }

  function renderGrid(data){
    const grid = document.getElementById('grid');
    grid.className = 'grid' + (twoCol ? ' two-col' : '');
    grid.innerHTML = '';
    const nowHour = new Date().getHours();
    const isToday = viewDate === todayISO();

    HOURS.forEach(h=>{
      const row = el('div', 'slot' + (isToday && h === nowHour ? ' now' : '') + (isToday && h < nowHour ? ' past' : ''));
      row.dataset.hour = h;

      const time = el('div', 'time');
      time.textContent = fmtHour(h);
      row.appendChild(time);

      const body = el('div', 'slot-body');
      const occupants = data.tasks.filter(t => t.time !== null && h >= t.time && h < t.time + (t.duration || 1));
      if(occupants.length === 0){
        const empty = el('div', 'empty-slot' + (selectedChip ? ' place' : ''));
        empty.textContent = selectedChip ? 'Tap here to place' : '';
        body.appendChild(empty);
      } else {
        occupants.forEach(t => body.appendChild(makeTaskRow(t, { continuation: t.time !== h })));
      }
      row.appendChild(body);

      row.addEventListener('dragover', (e)=>{ e.preventDefault(); row.classList.add('dragover'); });
      row.addEventListener('dragleave', ()=> row.classList.remove('dragover'));
      row.addEventListener('drop', (e)=>{
        e.preventDefault();
        row.classList.remove('dragover');
        const id = e.dataTransfer.getData('text/plain');
        if(id) assignTime(id, h);
      });
      row.addEventListener('click', (e)=>{
        if(e.target.closest('.task')) return;
        if(selectedChip){ assignTime(selectedChip, h); selectedChip = null; }
      });

      grid.appendChild(row);
    });
  }

  function makeTaskRow(t, opts){
    opts = opts || {};
    const row = el('div', 'task' + (t.done ? ' done' : '') + (opts.continuation ? ' continuation' : ''));

    const chk = el('button', 'chk');
    chk.type = 'button';
    chk.innerHTML = svg('check');
    chk.setAttribute('aria-label', t.done ? 'Mark not done' : 'Mark done');
    chk.addEventListener('click', ()=>{ t.done = !t.done; saveStore(); render(); });
    row.appendChild(chk);

    const title = el('span', 'title');
    title.textContent = t.title + (opts.continuation ? ' (cont.)' : '');
    row.appendChild(title);

    const acts = el('div', 'acts');
    if(t.time !== null && !opts.continuation) acts.appendChild(makeDurStepper(t));

    const bell = el('button', 'icon-btn bell' + (t.reminder ? ' on' : ''));
    bell.type = 'button';
    bell.innerHTML = svg(t.reminder ? 'bell' : 'bellOff');
    bell.setAttribute('aria-label', t.reminder ? 'Turn reminder off' : 'Turn reminder on');
    bell.addEventListener('click', ()=>{ t.reminder = !t.reminder; saveStore(); render(); });
    acts.appendChild(bell);

    const rm = el('button', 'icon-btn rm');
    rm.type = 'button';
    rm.innerHTML = svg('x');
    rm.setAttribute('aria-label', 'Remove task');
    rm.addEventListener('click', ()=> removeTask(t.id));
    acts.appendChild(rm);

    row.appendChild(acts);
    return row;
  }

  function makeDurStepper(t){
    const dur = t.duration || 1;
    const wrap = el('div', 'dur');

    const minus = el('button');
    minus.type = 'button';
    minus.innerHTML = svg('minus');
    minus.setAttribute('aria-label', 'Shorten block');
    minus.disabled = dur <= 1;
    minus.addEventListener('click', (e)=>{ e.stopPropagation(); changeDuration(t.id, -1); });
    wrap.appendChild(minus);

    const label = el('span');
    label.textContent = dur + 'h';
    wrap.appendChild(label);

    const plus = el('button');
    plus.type = 'button';
    plus.innerHTML = svg('plus');
    plus.setAttribute('aria-label', 'Block another hour');
    plus.disabled = t.time + dur >= 24;
    plus.addEventListener('click', (e)=>{ e.stopPropagation(); changeDuration(t.id, 1); });
    wrap.appendChild(plus);

    return wrap;
  }

  // ---------- mutations ----------
  function addTask(title, time, duration){
    const data = dayData(viewDate);
    data.tasks.push({ id: uid(), title, time: time===''||time===undefined ? null : Number(time), duration: duration ? Number(duration) : 1, reminder: false, done: false });
    saveStore();
    render();
  }
  function removeTask(id){
    const data = dayData(viewDate);
    data.tasks = data.tasks.filter(t => t.id !== id);
    if(selectedChip === id) selectedChip = null;
    saveStore();
    render();
  }
  function assignTime(id, hour){
    const data = dayData(viewDate);
    const t = data.tasks.find(t=>t.id===id);
    if(t){ t.time = hour; t.duration = Math.min(t.duration || 1, 24 - hour); saveStore(); render(); }
  }
  function changeDuration(id, delta){
    const data = dayData(viewDate);
    const t = data.tasks.find(t=>t.id===id);
    if(!t || t.time === null) return;
    t.duration = Math.min(24 - t.time, Math.max(1, (t.duration || 1) + delta));
    saveStore();
    render();
  }

  // ---------- add form ----------
  document.getElementById('addForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    const title = taskInput.value.trim();
    if(!title) return;
    const time = timeSelect.value;
    const dur = Number(durationSelect.value) || 1;
    addTask(title, time, time === '' ? 1 : Math.min(dur, 24 - Number(time)));
    taskInput.value = '';
    timeSelect.value = '';
    durationSelect.value = '1';
    taskInput.focus();
  });

  // ---------- day nav ----------
  function goTo(iso){ viewDate = iso; selectedChip = null; render(); }
  document.getElementById('prevDay').addEventListener('click', ()=> goTo(addDays(viewDate, -1)));
  document.getElementById('nextDay').addEventListener('click', ()=> goTo(addDays(viewDate, 1)));
  segToday.addEventListener('click', ()=> goTo(todayISO()));
  segTomorrow.addEventListener('click', ()=> goTo(tomorrowISO()));
  nowBtn.addEventListener('click', ()=>{
    const n = document.querySelector('.slot.now');
    if(n) n.scrollIntoView({ block:'center', behavior:'smooth' });
  });

  // ---------- reminders ----------
  const notifBtn = document.getElementById('notifBtn');
  function refreshNotifBtn(){
    const supported = 'Notification' in window;
    const on = supported && Notification.permission === 'granted';
    notifBtn.dataset.on = on ? '1' : '0';
    document.getElementById('notifLabel').textContent =
      on ? 'Reminders on' : (supported && Notification.permission === 'denied' ? 'Reminders blocked' : 'Reminders');
  }
  notifBtn.addEventListener('click', async ()=>{
    if(!('Notification' in window)) { alert('Notifications are not supported in this browser.'); return; }
    if(Notification.permission === 'default'){ await Notification.requestPermission(); }
    refreshNotifBtn();
  });
  refreshNotifBtn();

  function firedSet(){ try { return new Set(JSON.parse(localStorage.getItem(FIRED_KEY)) || []); } catch(e){ return new Set(); } }
  function saveFired(set){ localStorage.setItem(FIRED_KEY, JSON.stringify(Array.from(set))); }

  function checkReminders(){
    if(!('Notification' in window) || Notification.permission !== 'granted') return;
    const now = new Date();
    const iso = isoOf(now);
    const hour = now.getHours();
    const data = state[iso];
    if(!data) return;
    const fired = firedSet();
    data.tasks.forEach(t=>{
      if(t.reminder && !t.done && t.time === hour){
        const key = iso + '_' + t.id + '_' + hour;
        if(!fired.has(key)){
          fired.add(key);
          notify(t.title, iso);
        }
      }
    });
    saveFired(fired);
  }

  function notify(title, iso){
    const body = 'Scheduled for now — ' + niceDate(iso);
    if(navigator.serviceWorker && navigator.serviceWorker.ready){
      navigator.serviceWorker.ready.then(reg=>{
        reg.showNotification(title, { body, icon: 'icon-192.png', badge: 'icon-192.png' });
      }).catch(()=>{ new Notification(title, { body }); });
    } else {
      new Notification(title, { body });
    }
  }

  setInterval(checkReminders, 20000);
  checkReminders();

  // ---------- share as image ----------
  const FONT = '-apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
  function fitText(ctx, text, maxW){
    if(ctx.measureText(text).width <= maxW) return text;
    let s = text;
    while(s.length > 1 && ctx.measureText(s + '…').width > maxW) s = s.slice(0, -1);
    return s + '…';
  }

  function buildScheduleCanvas(){
    const data = dayData(viewDate);
    const scheduled = data.tasks.filter(t => t.time !== null).sort((a,b)=> a.time - b.time);
    const unscheduled = data.tasks.filter(t => t.time === null);
    const doneCount = data.tasks.filter(t => t.done).length;

    const W = 680, pad = 28, headH = 100, rowH = 44, secH = 46, footH = 50, scale = 2;
    const H = headH + 12 + Math.max(scheduled.length, 1) * rowH
      + (unscheduled.length ? secH + unscheduled.length * rowH : 0) + footH;

    const canvas = document.createElement('canvas');
    canvas.width = W * scale;
    canvas.height = H * scale;
    const ctx = canvas.getContext('2d');
    ctx.scale(scale, scale);

    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#3B5BDB';
    ctx.fillRect(0, 0, W, headH);
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.font = `700 12px ${FONT}`;
    ctx.fillText('PLAN', pad, 36);
    ctx.fillStyle = '#FFFFFF';
    ctx.font = `700 28px ${FONT}`;
    ctx.fillText(niceDate(viewDate), pad, 72);
    if(data.tasks.length){
      ctx.textAlign = 'right';
      ctx.font = `600 13px ${FONT}`;
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.fillText(`${doneCount} of ${data.tasks.length} done`, W - pad, 36);
      ctx.textAlign = 'left';
    }

    const timeColW = 150;
    const titleW = W - pad * 2 - timeColW;
    let y = headH + 12;

    function drawRow(label, labelColor, title, done, bullet){
      const base = y + rowH / 2 + 5;
      if(label){
        ctx.fillStyle = labelColor;
        ctx.font = `700 14px ${FONT}`;
        ctx.fillText(label, pad, base);
      }
      ctx.fillStyle = done ? '#A3A9B8' : '#1E2330';
      ctx.font = `600 15.5px ${FONT}`;
      const x = pad + (label ? timeColW : 0);
      const text = fitText(ctx, (bullet ? '•  ' : '') + title, label ? titleW : W - pad * 2);
      ctx.fillText(text, x, base);
      if(done){
        const w = ctx.measureText(text).width;
        ctx.strokeStyle = '#A3A9B8';
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(x, base - 5); ctx.lineTo(x + w, base - 5); ctx.stroke();
      }
      ctx.strokeStyle = '#ECE8DF';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(pad, y + rowH); ctx.lineTo(W - pad, y + rowH); ctx.stroke();
      y += rowH;
    }

    if(scheduled.length === 0){
      ctx.fillStyle = '#667085';
      ctx.font = `15px ${FONT}`;
      ctx.fillText('Nothing scheduled yet.', pad, y + rowH / 2 + 5);
      y += rowH;
    } else {
      scheduled.forEach(t=>{
        const dur = t.duration || 1;
        const label = dur > 1 ? `${fmtHour(t.time)} – ${fmtHour(t.time + dur)}` : fmtHour(t.time);
        drawRow(label, t.done ? '#A3A9B8' : '#3B5BDB', t.title, t.done, false);
      });
    }

    if(unscheduled.length){
      ctx.fillStyle = '#667085';
      ctx.font = `700 11px ${FONT}`;
      ctx.fillText('UNSCHEDULED', pad, y + 30);
      y += secH;
      unscheduled.forEach(t => drawRow('', '', t.title, t.done, true));
    }

    ctx.fillStyle = '#A3A9B8';
    ctx.font = `12px ${FONT}`;
    ctx.textAlign = 'center';
    ctx.fillText('Made with Plan', W / 2, H - 20);
    ctx.textAlign = 'left';

    return canvas;
  }

  function shareSchedule(){
    const canvas = buildScheduleCanvas();
    canvas.toBlob(async (blob)=>{
      if(!blob) return;
      const fileName = 'plan-' + viewDate + '.png';
      const file = new File([blob], fileName, { type: 'image/png' });

      if(navigator.canShare && navigator.canShare({ files: [file] })){
        try {
          await navigator.share({ files: [file], title: 'Plan', text: niceDate(viewDate) });
        } catch(e){ /* user cancelled the share sheet */ }
      } else {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(()=> URL.revokeObjectURL(url), 4000);
      }
    }, 'image/png');
  }
  document.getElementById('shareBtn').addEventListener('click', shareSchedule);

  // ---------- service worker ----------
  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    });
  }

  render();
})();
</script>
</body>
</html>
